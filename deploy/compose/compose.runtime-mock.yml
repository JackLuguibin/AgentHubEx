# Optional overlay: document how to attach an intranet OpenCode serve + mock LLM.
# P0 default does NOT require this file — hub-api RUNTIME_MOCK=true uses an in-process mock.
#
# Usage (when you have a private registry / local opencode binary):
#   docker compose -f deploy/compose/compose.intranet.yml \
#     -f deploy/compose/compose.runtime-mock.yml --profile runtime up -d
#
# Then register the instance with hub-api:
#   POST /v1/tenants/{tid}/instances
#   { "name": "opencode-local", "baseUrl": "http://host.docker.internal:4096",
#     "runtimeType": "opencode", "auth": { "username": "opencode", "password": "..." } }
# And set RUNTIME_MOCK=false in hub-api env.

name: agenthub-intranet

services:
  # Placeholder: replace image with your mirrored opencode serve.
  # Do not pull public LLM endpoints; point OPENCODE / provider baseUrl at intranet mock.
  opencode-mock:
    profiles: ["runtime"]
    image: agenthub/opencode-serve:local
    environment:
      # Example: intranet-only OpenAI-compatible mock (wiremock / litellm / custom)
      OPENCODE_MODEL_BASE_URL: http://llm-mock:8081/v1
      OPENCODE_MODEL_API_KEY: mock-key
    ports:
      - "4096:4096"
    networks:
      - default
    restart: "no"

  llm-mock:
    profiles: ["runtime"]
    image: agenthub/llm-mock:local
    ports:
      - "8081:8081"
    restart: "no"
