# Control plane only. Worker containers stay on Docker + node-agent (ADR-002).
# Do not add a workspace DaemonSet or a per-user Pod here.
apiVersion: v1
kind: Namespace
metadata:
  name: agenthub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-config
  namespace: agenthub
data:
  DEPLOY_PROFILE: intranet
  NODE_MTLS_PORT: "8443"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.agenthub.svc:4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-api
  namespace: agenthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hub-api
  template:
    metadata:
      labels:
        app: hub-api
    spec:
      containers:
        - name: hub-api
          image: agenthub/hub-api:local
          ports:
            - name: http
              containerPort: 8080
            - name: mtls
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: hub-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-data
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-data
                  key: redis-url
            - name: PLATFORM_DEK
              valueFrom:
                secretKeyRef:
                  name: agenthub-kek
                  key: platform-dek
            - name: AGENTHUB_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-kek
                  key: master-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: hub-api
  namespace: agenthub
spec:
  selector:
    app: hub-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: mtls
      port: 8443
      targetPort: mtls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-jobs
  namespace: agenthub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hub-jobs
  template:
    metadata:
      labels:
        app: hub-jobs
    spec:
      containers:
        - name: hub-jobs
          image: agenthub/hub-api:local
          args: ["node", "dist/index.js"]
          envFrom:
            - configMapRef:
                name: hub-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-data
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-data
                  key: redis-url
            - name: PLATFORM_DEK
              valueFrom:
                secretKeyRef:
                  name: agenthub-kek
                  key: platform-dek
            - name: AGENTHUB_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agenthub-kek
                  key: master-key
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hub-api
  namespace: agenthub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hub-api
